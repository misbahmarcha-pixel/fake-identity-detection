{% extends "base.html" %}
{% block title %}Log In &mdash; VerifyGrid{% endblock %}
{% block content %}
<span class="eyebrow">Welcome Back</span>
<h1>Log In</h1>
<form class="card" style="max-width:380px;" method="post">
  {% if error %}<p style="color:var(--rejected); margin-top:0;">{{ error }}</p>{% endif %}
  <label for="username">Username</label>
  <input type="text" id="username" name="username" required>
  <label for="password" style="margin-top:12px;">Password</label>
  <input type="password" id="password" name="password" required>
  <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
  <button class="submit" type="submit" style="margin-top:16px;">Log In</button>
  <p class="hint" style="margin-top:14px;">No account yet? <a href="{{ url_for('signup') }}" class="link-accent">Sign up</a></p>
</form>
{% endblock %}
