{% extends "base.html" %}

{% block title %}Reset Password &mdash; VerifyGrid{% endblock %}

{% block content %}

<span class="eyebrow">Account Recovery</span>

<h1>Reset Password</h1>

<form class="card" style="max-width:380px;" method="post">

    {% if error %}
        <p style="color:var(--rejected); margin-top:0;">
            {{ error }}
        </p>
    {% endif %}

    <label for="password">New Password</label>

    <input
        type="password"
        id="password"
        name="password"
        minlength="6"
        required
    >

    <label
        for="confirm_password"
        style="margin-top:12px;"
    >
        Confirm New Password
    </label>

    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        minlength="6"
        required
    >

    <button
        class="submit"
        type="submit"
        style="margin-top:16px;"
    >
        Reset Password
    </button>

</form>

{% endblock %}
