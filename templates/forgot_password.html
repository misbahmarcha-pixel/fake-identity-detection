{% extends "base.html" %}

{% block title %}Forgot Password &mdash; VerifyGrid{% endblock %}

{% block content %}

<span class="eyebrow">Account Recovery</span>

<h1>Forgot Password?</h1>

<p>
    Enter the email address associated with your account.
    If the account exists, you will receive a password reset link.
</p>

<form class="card" style="max-width:380px;" method="post">

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <button
        class="submit"
        type="submit"
        style="margin-top:16px;"
    >
        Send Reset Link
    </button>

    <p class="hint" style="margin-top:14px;">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>

</form>

{% endblock %}
