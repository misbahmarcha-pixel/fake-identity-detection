{% extends "base.html" %}
{% block title %}Sign Up &mdash; VerifyGrid{% endblock %}
{% block content %}
<span class="eyebrow">Create Your Account</span>
<h1>Sign Up</h1>
<p class="subtitle">Create an account first, then verify your identity in the next step.</p>
<form class="card" style="max-width:440px;" method="post">
  {% if error %}<p style="color:var(--rejected); margin-top:0;">{{ error }}</p>{% endif %}
  <div class="form-grid">
    <div class="full">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="full">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="full">
      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" name="phone" placeholder="9XXXXXXXXX" required>
    </div>
    <div class="full">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="full">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="full">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required>
    </div>
  </div>
  <button class="submit" type="submit" style="margin-top:16px;">Create Account</button>
  <p class="hint" style="margin-top:14px;">Already have an account? <a href="{{ url_for('login') }}" class="link-accent">Log in</a></p>
</form>
{% endblock %}
